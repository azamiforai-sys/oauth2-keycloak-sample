<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>OAuth2 学習サンプル</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header>
  <h1><a href="/">OAuth2 学習サンプル</a></h1>
  <div th:if="${user != null}">
    <span th:text="${user.preferredUsername}">user</span> さん
    <form th:action="@{/logout}" method="post" style="display:inline"><button type="submit">ログアウト</button></form>
  </div>
</header>
<div th:if="${user == null}">
  <p>Spring Security の OAuth2 Client と Keycloak を使ったログインのサンプルです。</p>
  <p><a href="/oauth2/authorization/keycloak">Keycloak でログイン</a>（alice / alice、bob / bob）</p>
</div>
<div th:if="${user != null}">
  <p>ログイン中: <b th:text="${user.fullName}"></b>（<span th:text="${user.email}"></span>）</p>
  <h2>試してみる</h2>
  <ul>
    <li><a href="/tokens">取得したトークンの中身を見る</a></li>
    <li>ユーザーのアクセストークンで API を呼ぶ:
      <a href="/api-call?path=public">/api/public</a> ・
      <a href="/api-call?path=user">/api/user</a> ・
      <a href="/api-call?path=admin">/api/admin</a></li>
    <li>Client Credentials のトークンで API を呼ぶ:
      <a href="/api-call?path=user&amp;registration=batch">/api/user</a> ・
      <a href="/api-call?path=admin&amp;registration=batch">/api/admin</a></li>
  </ul>
</div>
</body>
</html>
